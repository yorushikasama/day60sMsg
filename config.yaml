# ============================================================
# day60sMsg 配置文件
# 每日 9 点：多源抓取 -> AI 挑选 -> 生成邮件 -> QQ 邮箱发送
# ============================================================

email:
  # 发件邮箱（QQ 邮箱，password 填 SMTP 授权码，不是 QQ 密码）
  from_addr: "123456789@qq.com"
  from_name: "day60sMsg"   # 收件箱中显示的发件人名称
  to_addrs:
    - "123456789@qq.com"
  smtp:
    host: smtp.qq.com
    port: 465
    user: "123456789@qq.com"
    password: "在这里填QQ邮箱SMTP授权码"

# 个人关注主题：重要性相近时 AI 会优先挑选相关条目（留空表示无偏好）
interests: []
# 例: ["人工智能", "芯片", "新能源"]

# 头条推送：策展发送成功后，把最重要 N 条推到手机（尽力而为，失败不影响邮件）
push:
  enabled: false
  top_n: 5
  channels:
    # ntfy（推荐，无需注册，App 订阅同名主题即可）:
    # ntfy:
    #   url: https://ntfy.sh/起一个别人猜不到的私有主题名
    # bark（iOS）:
    # bark:
    #   url: https://api.day.app/你的BarkKey
    # telegram:
    # telegram:
    #   bot_token: "123456:ABC"
    #   chat_id: "你的chat_id"

# AI 策展：任何 OpenAI 兼容接口均可（智谱 GLM / DeepSeek / 通义 / 自建中转）
# 智谱:  base_url: https://open.bigmodel.cn/api/paas/v4   model: glm-4-flash（免费额度大）
# DeepSeek: base_url: https://api.deepseek.com            model: deepseek-chat
llm:
  base_url: https://open.bigmodel.cn/api/paas/v4
  api_key: ""            # 留空则不启用 AI，自动降级为按来源权重挑选
  model: glm-4-flash
  # 备用模型：主模型重试耗尽后依次尝试（各模型限流额度相互独立）。
  # 需与 base_url 对应的服务商匹配。示例（SenseNova）: [glm-5.2, kimi-k3]
  fallback_models: []
  timeout: 120
  temperature: 0.2
  retries: 3             # 单个模型的重试次数（针对 429/5xx/超时等可恢复错误）
  retry_backoff: 5       # 重试基础退避秒数，按 5s/10s/20s 指数递增
  max_total_seconds: 600 # 全部模型重试的总时限，超过则放弃并降级，确保 9 点前送达
  max_tokens: null       # 可选：限制输出长度（防止部分模型默认输出过小导致 JSON 截断）

fetch:
  window_hours: 48       # 只收录最近 N 小时发布的内容（无日期的源不受限）。
                         # 48h 而非 24h：官方博客等一手源发布频率低（几天一篇），
                         # 窗口太窄会把最有价值的一手信息滤掉；去重机制保证不重复推送。
  max_per_source: 8      # 每个源最多送入 AI 的候选条数（主题检索源条目多，控制总量）
  timeout: 20            # 单源请求超时（秒）
  retries: 2

# 各版块选取条数（AI 挑选时的预算；无 AI 时同样生效）
budget:
  国际: 10
  国内: 10
  AI前沿: 10

# ------------------------------------------------------------
# 数据源
#   type: rss   —— 任意 RSS/Atom（含自建 RSSHub 输出）
#   type: 60s   —— vikiboss/60s 聚合接口（每天60秒读懂世界）
#   section: 国际 / 国内 / AI前沿
#   weight: 降级模式(无 AI)时的排序权重，越大越靠前
#   enabled: false 可临时停用某个源
# ------------------------------------------------------------
sources:
  - name: 每天60秒读懂世界
    type: 60s
    url: https://60s.viki.moe/v2/60s
    section: 国内
    weight: 8
    enabled: true
  # 备用镜像：主源失败时兜底（两者数据相同，按标题去重不会重复推送）
  - name: 每天60秒读懂世界(备用)
    type: 60s
    url: https://60s-api.viki.moe/v2/60s
    section: 国内
    weight: 8
    enabled: true

  # ---- 国际 ----
